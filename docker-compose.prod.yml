# KainBain minimal production install (installed to ~/apps/kainbain by deploy.sh --prod).
# Only prebuilt images run here — no source checkout is needed in this folder.
#   docker compose -f docker-compose.yml up -d   (file is renamed on install)
# Host paths come from .env (KAINBAIN_PROJECTS_HOST / KAINBAIN_STATE_HOST /
# KAINBAIN_NOTES_HOST) so an existing install keeps its current folders.
# Per-component images/tags (AsymmetricUpdatesPlan DA7): KAINBAIN_BACKEND_IMAGE /
# KAINBAIN_FRONTEND_IMAGE carry the fully-qualified published image (set by
# publish/redeploy from the release manifest; default stays the local names)
# and KAINBAIN_BACKEND_TAG / KAINBAIN_FRONTEND_TAG pin each component's tag,
# each falling back to the legacy single KAINBAIN_IMAGE_TAG, then latest.
services:
  backend:
    image: ${KAINBAIN_BACKEND_IMAGE:-kainbain-backend}:${KAINBAIN_BACKEND_TAG:-${KAINBAIN_IMAGE_TAG:-latest}}
    expose: ["3100"]
    env_file: [{ path: .env, required: false }]
    environment:
      NODE_ENV: production
      PORT: "3100"
      PROJECTS_ROOT: ${KAINBAIN_PROJECTS_CONTAINER_PATH:-/workspace/projects}
      NOTES_SPACE_ROOT: ${KAINBAIN_NOTES_CONTAINER_PATH:-/home/node/.kainbain/notes}
      KAINBAIN_DIST: /app/frontend/dist
      KAINBAIN_BUILD_REF: ${KAINBAIN_IMAGE_TAG:-latest}
      KAINBAIN_BUILD_NUMBER: ${KAINBAIN_BUILD_NUMBER:-0}
    volumes:
      - ${KAINBAIN_PROJECTS_HOST:-./projects}:${KAINBAIN_PROJECTS_CONTAINER_PATH:-/workspace/projects}
      - ${KAINBAIN_STATE_HOST:-./data}:/home/node/.kainbain
      - ${KAINBAIN_NOTES_HOST:-./notes}:${KAINBAIN_NOTES_CONTAINER_PATH:-/home/node/.kainbain/notes}
    restart: unless-stopped
  frontend:
    image: ${KAINBAIN_FRONTEND_IMAGE:-kainbain-frontend}:${KAINBAIN_FRONTEND_TAG:-${KAINBAIN_IMAGE_TAG:-latest}}
    ports: ["${KAINBAIN_PORT:-3100}:80"]
    depends_on: [backend]
    restart: unless-stopped
