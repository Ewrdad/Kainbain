# KainBain frontend reverse proxy (MigrationPlan Phase 1 WP-1.1).
#
# Same-origin is mandatory: the browser loads the UI and calls the API from
# ONE user-facing origin (the frontend service). The API has no path prefix
# (routes live at /projects, /tasks, /status, /ws, ...), so this config
# proxies by explicit API-prefix list and serves everything else as static
# files with an SPA fallback. A two-port outcome (UI on one port, API on
# another) is a Goal violation requiring a Goal amendment, not a note here.
#
# API prefix inventory (verified 2026-10-26 against api/routes/*.js,
# api/work/*.js, api/flow/*.js, api/watch/*.js, api/index.js — non-test
# sources only; /repo/* hits there are @example cwd strings, not routes):
#   agent api compute deploy docs documentation engine harnesses projects
#   push retrospective session settings skills status tasks workflows ws
# When a new top-level API prefix is added, it MUST be added to the
# location regex below or the UI will receive index.html instead of JSON.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# NOTE: the backend address uses the variable form (`$upstream_backend`,
# resolved lazily per request via Docker's embedded DNS) instead of an
# `upstream {}` block on purpose: a static upstream resolves at boot, so
# nginx would refuse to start while the backend container is still
# starting or being recreated. Lazy resolution removes the startup
# ordering dependency beyond compose `depends_on`.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS (this config only ever runs in compose). It is
  # REQUIRED (not optional): the backend address below is a variable
  # (`$upstream_backend`, resolved lazily per request so nginx boots while
  # the backend is still starting), and variable-form proxy_pass does not
  # use the startup resolver — without this line every API call 502s with
  # "no resolver defined to resolve backend".
  resolver 127.0.0.11 valid=30s;

  # Long-lived streams: agent log streams and the /ws socket stay open for
  # the life of a stage (per-stage timeout is 30 minutes engine-side).
  proxy_connect_timeout 10s;
  proxy_send_timeout 1h;
  proxy_read_timeout 1h;

  # Backend API (JSON + WebSocket). Upgrade headers are conditional via the
  # map above so plain API calls are not sent `Connection: upgrade`.
  location ~ ^/(agent|api|compute|deploy|docs|documentation|engine|harnesses|projects|push|retrospective|runners|session|settings|skills|status|tasks|workflows|ws)(/|$) {
    set $upstream_backend backend:3100;
    proxy_pass http://$upstream_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Static UI assets with immutable-style caching (Vite hashes filenames).
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: unmatched GETs serve the app shell. API routes never reach
  # here (matched above); unknown API paths therefore still 404 as JSON
  # from the backend instead of returning index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
